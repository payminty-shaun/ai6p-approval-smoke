# AI6P-822 spike — Mechanism A, low-environment leg.
# Push to main is the ONLY trigger. This is the "deploy to SIT" leg of the split
# pipeline. In a real tenant this would `cdk deploy` + `amplify start-job` against
# the S5-created SIT role/branch; on the sacrificial repo it only records which SHA
# landed in SIT so the promote leg can be checked against it.
name: deploy-sit
on:
  push:
    branches: [main]
jobs:
  deploy-sit:
    runs-on: ubuntu-latest
    environment: sit
    steps:
      - uses: actions/checkout@v4
      - name: Record SHA deployed to SIT
        run: |
          echo "SIT deploy of commit: ${GITHUB_SHA}"
          echo "payload marker in this commit:"
          cat PAYLOAD.txt
