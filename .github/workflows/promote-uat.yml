# Promote to a higher environment — webapp-owned delivery promotion (AI6P-826,
# Mechanism A). One such workflow is rendered per higher environment created by
# the S5 per-env CloudFormation stack (AI6P-717): promote-uat.yml, promote-prod.yml, …
#
# THE GATE IS THE TRIGGER. This workflow has **no `push` trigger** — its only
# trigger is `workflow_dispatch`. The Product Sweet webapp's approval action is
# what dispatches it, supplying the reviewed commit as the `sha` input. Because
# nothing pushes to it, the webapp is the only sanctioned promote path.
#
# Soft enforcement (documented, deliberate): a repo admin with Actions-write can
# still run this workflow manually from the Actions UI / API, so this is a
# *sanctioned, audited* path, not a *hard* gate. Tenants who need an
# unbypassable gate use the optional GitHub custom deployment protection rule
# (Mechanism B), available on public repos / GitHub Enterprise only. See
# knowledge.md "Webapp-owned delivery promotion".
#
# AI6P-249 / AI6P-278 / AI6P-414 / AI6P-717 / AI6P-826 lessons:
#   - `actions/checkout` is pinned to `${{ inputs.sha }}` — NEVER main HEAD — so
#     the promoted artefact is exactly the commit the user reviewed in the lower
#     environment. A bare checkout would silently ship HEAD instead.
#   - `environment: <env>` pulls the env-scoped GitHub Actions variables (S6) —
#     the per-env override of `PRODUCTSWEET_DEPLOY_ROLE_ARN` resolves the S5
#     per-env deploy role (`AI6P-Tenant-<env>-Env-Role`); the bare repo-level
#     value is the fallback. With `environment:` set, GitHub mints an OIDC token
#     whose `sub` is `repo:OWNER/REPO:environment:<env>`, which the per-env role
#     trust must match (AI6P-905 finding #1).
#   - The Amplify branch deployed is `<env>` — the per-env branch the S5 stack
#     creates on the tenant's existing Amplify app. An Amplify `RELEASE` job
#     clones the GIT branch named `<env>` and rebuilds it, so the deployed
#     artefact is whatever that branch points at. This workflow therefore
#     force-advances the `<env>` git branch to the reviewed `sha` before the
#     RELEASE (AI6P-905 finding #3) — that is what makes the sha-pin
#     load-bearing. (The per-env Amplify branch has auto-build OFF, so this push
#     cannot race the RELEASE.) The local `Build` step is a fail-fast gate: a
#     commit that doesn't build never advances the env branch.
#   - `permissions: id-token: write` enables OIDC token minting (canonical-checklist §B4);
#     `contents: write` lets the job push the reviewed sha to the `<env>` branch.
#   - Amplify auto-build is OFF (canonical-checklist §C4) — we start the job, then
#     poll until terminal.
#   - Actions are SHA-pinned per AI6P-103/-104 supply-chain hardening.
#
# Templated by the AI6P-249 bootstrap; substituted placeholders:
#   PROMOTE_ENV_NAME  the higher environment name, e.g. `uat`, `prod`
#   INSTALL_COMMAND   e.g. `npm ci --no-audit --no-fund`
#   BUILD_COMMAND     e.g. `npm run build`
#   AWS_REGION        baked-in region, e.g. `ap-southeast-2`
name: promote-uat

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Reviewed commit SHA to promote (pinned; never HEAD)."
        required: true
        type: string

permissions:
  # `contents: write` — the job force-advances the `uat` git
  # branch to the reviewed sha so Amplify's RELEASE clone deploys exactly that
  # commit. `id-token: write` — OIDC token minting for the deploy role.
  contents: write
  id-token: write

concurrency:
  group: promote-uat
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          # Node 24 — matches the Product Sweet build agent so the
          # package-lock.json it generates is faithful to what `npm ci`
          # validates.
          node-version: 24
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.PRODUCTSWEET_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Advance uat branch to the reviewed commit
        # Amplify RELEASE re-clones the git branch named uat and
        # rebuilds it, so the deployed artefact is whatever that branch points
        # at. Force-advance the branch to the reviewed sha so RELEASE deploys
        # EXACTLY the commit reviewed in the lower environment (this is what
        # makes the sha-pin load-bearing). actions/checkout persists the
        # credentials this push uses; the branch has Amplify auto-build OFF, so
        # the push cannot race the RELEASE below.
        run: |
          set -euo pipefail
          git push --force origin "${{ inputs.sha }}:refs/heads/uat"

      - name: Trigger Amplify RELEASE for uat
        id: release
        run: |
          set -euo pipefail
          job_id=$(aws amplify start-job \
            --app-id "${{ vars.PRODUCTSWEET_AMPLIFY_APP_ID }}" \
            --branch-name uat \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Started Amplify job $job_id for uat (sha ${{ inputs.sha }})"

      - name: Poll Amplify job to terminal status
        run: |
          set -euo pipefail
          job_id="${{ steps.release.outputs.job_id }}"
          for i in $(seq 1 60); do
            status=$(aws amplify get-job \
              --app-id "${{ vars.PRODUCTSWEET_AMPLIFY_APP_ID }}" \
              --branch-name uat \
              --job-id "$job_id" \
              --query 'job.summary.status' \
              --output text)
            echo "Amplify job $job_id status: $status (poll $i/60)"
            case "$status" in
              SUCCEED) exit 0 ;;
              FAILED|CANCELLED) exit 1 ;;
              PENDING|PROVISIONING|RUNNING) sleep 30 ;;
              *) echo "Unknown status $status" >&2; exit 1 ;;
            esac
          done
          echo "Timed out after 30 minutes" >&2
          exit 1
