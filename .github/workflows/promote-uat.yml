# AI6P-822 spike — Mechanism A, promotion leg.
# NO push trigger. workflow_dispatch is the ONLY sanctioned run path, so the webapp
# firing POST /actions/workflows/promote-uat.yml/dispatches IS the gate. The `sha`
# input is load-bearing: the job checks out THAT exact commit (the one the user saw
# in SIT), never main HEAD. `environment: uat` shows S6 env-scoped vars compose with
# no protection rule (works on Pro/Team private repos, all plans).
name: promote-uat
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact commit SHA that was approved in SIT (must be promoted, not HEAD)"
        required: true
        type: string
jobs:
  promote-uat:
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout the SHA-pinned commit (NOT HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - name: Prove we promoted the pinned SHA
        run: |
          echo "dispatch input sha: ${{ inputs.sha }}"
          echo "resolved HEAD in checkout: $(git rev-parse HEAD)"
          echo "payload marker actually promoted to UAT:"
          cat PAYLOAD.txt
